<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background-color: #0a192f; }
      
      /* 最顶层的全屏遮罩，z-index 设为极高，绝对不会被挡住 */
      #overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: #0a192f; z-index: 99999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        color: white; font-family: sans-serif; text-align: center; padding: 20px;
      }
      
      .btn {
        padding: 15px 40px; font-size: 20px; background: #B3BFD5; color: #0a192f;
        border: none; border-radius: 30px; font-weight: bold; cursor: pointer;
      }
      
      /* 错误提示框 */
      #error-msg {
        display: none; margin-top: 20px; padding: 15px; 
        background: rgba(255, 0, 0, 0.2); border: 1px solid red; 
        color: #ffcccc; border-radius: 8px; font-size: 14px;
      }
    </style>
  </head>
  <body>
    <!-- 启动遮罩 -->
    <div id="overlay">
      <h1 style="margin-bottom: 10px; color: #B3BFD5;">Epoch 历元 AR</h1>
      <p style="margin-bottom: 30px;">点击启动，并允许相机权限</p>
      <button class="btn" id="startButton">点击启动</button>
      <div id="error-msg"></div>
    </div>

    <!-- 注意这里加了 autoStart: false; 意思是等按钮点了再启动 -->
    <a-scene mindar-image="autoStart: false; imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" background="color: #0a192f">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <a-entity mindar-image-target="targetIndex: 0">
        <a-entity scale="1.2 1.2 1.2">
          <a-torus position="0 -0.4 0" rotation="-90 0 0" radius="0.6" radius-tubular="0.02" color="#B3BFD5" animation="property: rotation; to: -90 360 0; dur: 10000; loop: true; easing: linear"></a-torus>
          <a-cylinder position="0 -0.25 0" radius="0.35" height="0.15" color="#B3BFD5"></a-cylinder>
          <a-cylinder position="0 -0.1 0" radius="0.25" height="0.15" color="#FFFFFF" material="roughness: 0.2"></a-cylinder>
          <a-cylinder position="0 0.05 0" radius="0.015" height="0.15" color="#FFD700"></a-cylinder>
          <a-sphere position="0 0.15 0" radius="0.03" color="#FF4500" material="emissive: #FF4500; emissiveIntensity: 2" animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 300; loop: true"></a-sphere>
          <a-entity position="0 0.4 0" animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear">
            <a-sphere position="0.15 0 0" radius="0.04" color="#FF6B6B" material="emissive: #FF6B6B; emissiveIntensity: 1.5"></a-sphere>
            <a-sphere position="-0.15 0 0" radius="0.04" color="#4ECDC4" material="emissive: #4ECDC4; emissiveIntensity: 1.5"></a-sphere>
            <a-box position="0 0 0" width="0.3" height="0.005" depth="0.005" color="#FFFFFF" opacity="0.5"></a-box>
          </a-entity>
          <a-text value="Happy Birthday" position="0 0.65 0" align="center" color="#FFD700" width="1.5" font="mozillavr"></a-text>
          <a-text value="Epoch 12.19" position="0 0.55 0" align="center" color="#B3BFD5" width="1" font="mozillavr"></a-text>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const startButton = document.getElementById('startButton');
      const overlay = document.getElementById('overlay');
      const errorMsg = document.getElementById('error-msg');
      const scene = document.querySelector('a-scene');

      startButton.addEventListener('click', () => {
        startButton.innerText = "正在启动...";
        startButton.style.background = "#666";
        
        // 调用 MindAR 官方的启动方法
        try {
          scene.systems['mindar-image-system'].start().then(() => {
            overlay.style.display = 'none'; // 启动成功，隐藏遮罩
          }).catch((err) => {
            showError(err.message || "系统拒绝了摄像头");
          });
        } catch (e) {
          showError("请刷新页面重试，或确保页面完全加载。");
        }
      });

      function showError(msg) {
        startButton.innerText = "点击重试";
        startButton.style.background = "#B3BFD5";
        errorMsg.style.display = 'block';
        errorMsg.innerHTML = "<b>启动失败：</b><br>" + msg + "<br><br><b>排查建议：</b><br>1. 请在手机自带浏览器（如Safari/Chrome）打开，绝对不要在微信里打开。<br>2. 检查手机设置里，是否禁止了该浏览器使用相机。";
      }
    </script>
  </body>
</html>
